<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MHHH — Fieldnotes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #101f23; color: #edf0df; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; background: #101f23; }
    .eyebrow { color: #dfbd7c; letter-spacing: .3em; font-size: 12px; }
    h1 { font-weight: 500; font-size: clamp(32px, 5vw, 56px); letter-spacing: -.04em; margin: 22px 0; }
    p { color: #a6bcb4; max-width: 520px; line-height: 1.7; }
    progress { width: min(420px, 80vw); height: 4px; accent-color: #dfbd7c; }
    #status { font-size: 13px; white-space: pre-wrap; }
    #loading.hidden { display: none; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="MHHH hunting game. WASD to move, mouse to turn, Escape to pause.">Your browser needs WebGL 2 to run this game.</canvas>
  <div id="loading" role="status">
    <span class="eyebrow">MHHH / FIELDNOTES 001</span>
    <h1>Preparing the field.</h1>
    <p>A small hunting game, one deliberate step at a time.<br>Desktop keyboard and mouse required.</p>
    <progress id="progress"></progress>
    <p id="status">Loading engine and field resources…</p>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      status.textContent = 'This browser is missing: ' + missing.join(', ') + '. Try a current desktop Chrome or Firefox with hardware acceleration enabled.';
      progress.hidden = true;
    } else {
      engine.startGame({
        canvas,
        onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
          status.textContent = total > 0 ? `Loading field · ${Math.round(current / total * 100)}%` : 'Preparing engine…';
        },
        onExit(code) { loading.classList.remove('hidden'); status.textContent = `Game stopped (${code}). Reload to restart.`; },
      }).then(() => {
        loading.classList.add('hidden');
        canvas.focus();
      }).catch(error => {
        status.textContent = 'Unable to start. Reload to retry.\n' + (error.message || String(error));
        progress.hidden = true;
        console.error(error);
      });
    }
  </script>
</body>
</html>
